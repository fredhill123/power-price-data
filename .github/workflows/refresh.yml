name: Refresh ENTSO-E power-price data

# Keeps the published CSVs current with NO human trigger, so a non-technical
# person just opens the Excel workbook (set to refresh-on-open) and gets fresh
# data. Also runnable on demand from the Actions tab ("Run workflow").
# The run name, and it is load-bearing rather than cosmetic. repair.yml dispatches THIS
# workflow with repair=true, so a repair appears in the same run list as a full refresh
# while doing a fraction of the work. The status page quotes what the last successful run
# took, and with no way to tell the two apart the first repair would have it promising two
# minutes for a job that takes closer to an hour. `inputs` is null for a scheduled run,
# which yields the plain name.
run-name: ${{ inputs.repair && 'Repair (only the series that failed)' || 'Refresh' }}

on:
  schedule:
    # 07:23 UTC on the 2nd. Three deliberate choices, all measured:
    #
    #  * the 2nd, not the 1st or the 3rd (Fred's call, 2026-08-01). What sets the floor
    #    is not the publication lag but the MONTH GATE: a month counts complete only
    #    once coverage passes its final hour, so July needs coverage_end >= 1 Aug 00:00.
    #    Coverage trails the run by ~1h34m (measured 2026-07-30; corroborated by the
    #    2026-07-31 17:29 run, whose coverage ended 16:00). That gives, for a late
    #    ENTSO-E publication:
    #
    #        1st  07:23 ->  7h23m of allowance   (~5h49m over the normal lag)
    #        2nd  07:23 -> 31h23m
    #        3rd  07:23 -> 55h23m
    #
    #    The 1st was rejected on the FAILURE MODE, not the odds. Exceeding the
    #    allowance does not fail the run: it succeeds, publishes, and silently omits the
    #    month from every monthly exhibit until the next scheduled run a month later.
    #    The shrink guard cannot see that — a month that never arrives is not a shrink —
    #    which is why check_coverage.check_month_arrived now asserts it directly. The
    #    2nd keeps a day in hand and still lands the month a day earlier than the 3rd.
    #    There is no weekend gap to worry about either way (weekend/weekday row ratio
    #    0.998; European power markets clear every day).
    #
    #  * :23, not :00 — GitHub queues scheduled workflows on shared runners and delays
    #    them under load, and load spikes hardest on the hour. An odd minute avoids the
    #    worst of the queue.
    #
    #  * FOUR RUNS A MONTH ON FIXED DATES, not weekly (Fred's call, 2026-08-03). This
    #    replaced first the monthly-only schedule and then a brief weekly one. Fixed dates
    #    beat a weekday cron on the thing that matters here — being explainable to someone
    #    who did not build it. "The 2nd, 10th, 18th and 26th" is a complete answer to
    #    "when does it run"; "every Monday" gives four runs in some months and five in
    #    others, on dates that wander. The runs land on varying weekdays, which is
    #    irrelevant: European power markets clear every day (weekend/weekday row ratio
    #    0.998).
    #
    #    Gaps are 8, 8, 8 days, then 7 to the next month's 2nd — shorter in February.
    #    That 8-day maximum is what the staleness alarm is sized against, so if you
    #    change these dates, change EXPECTED_REFRESH_DAYS in build_status.py to match.
    #
    #    The audit that justified monthly-only (2026-07-30) still stands on its own
    #    terms: no chart gains a data point mid-month, so running more often buys no new
    #    data. What it buys is FAILURE RECOVERY, which that audit did not weigh. Under
    #    monthly-only a red run left the published data untouched for a further 30 days;
    #    this heals the same failure in 8. That matters far more during a long unattended
    #    period than chart granularity does.
    - cron: "23 7 2,10,18,26 * *"
    #
    # ⚠ GitHub disables scheduled workflows after 60 days with no repository activity,
    # and that is one reason not to go back to running monthly. The arithmetic on
    # monthly-only was worse than the old comment here claimed: it said two consecutive
    # failures were needed, but ONE was enough — a failed run on the 2nd left no commit
    # until the 2nd of the following month, which is 61 days, so the schedule would have
    # been disabled the day before the run that would have healed it. Worse, commits
    # pushed by the Actions bot with GITHUB_TOKEN are widely reported not to reset the
    # clock at all. A maximum 8-day gap puts the question beyond reach either way.
    # If the Status tab ever shows STALE, check the Actions tab for a disabled schedule.
  workflow_dispatch:
    inputs:
      repair:
        description: "Re-fetch ONLY the series the last run could not get, then build and publish as normal. Set by repair.yml; ticking it by hand does nothing unless a gaps record exists."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Serialise runs. Two overlapping runs on 2026-07-31 raced: the first pushed while the
  # second was still fetching, and the second then failed trying to reconcile. The commit
  # step is now conflict-proof on its own, but queueing also stops two 25-minute jobs
  # burning in parallel to produce the same files.
  group: refresh
  cancel-in-progress: false

jobs:
  # ---- 1) fetch each country in parallel (keeps wall-clock ~40 min) ----------
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 100          # DE 15-min data is slow on GitHub's 2-core runners (~60-65 min)
    strategy:
      fail-fast: false
      matrix:
        # GB is here even though it is NOT an ENTSO-E source: Great Britain stopped
        # publishing to the Transparency Platform on 15 June 2021, and its series come
        # from Elexon, the ECB and DUKES instead. The fetch step below picks the right
        # fetcher per country by asking config, so this list stays the single place a
        # market is added.
        country: [DE, ES, PT, FR, IT, GB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # BEFORE fetching, not after. A label entsoe-py has renamed drops its series
      # silently while every job still reports success: that is how run-of-river
      # vanished from eight months of 2026 on 2026-09-05 and only the publish-time
      # coverage guard noticed. One second here beats an hour of fetching into a hole.
      - name: Labels config.py maps still exist upstream
        working-directory: _tools
        run: python check_label_drift.py
      # A FALLBACK STORE, NOT AN OPTIMISATION (restored 2026-08-23, Fred's call; moved OFF
      # the Actions cache 2026-09-06). Read the history before touching this, because the
      # cache was deliberately REMOVED on 2026-08-03 and that reason still stands.
      #
      # WHAT WENT WRONG WITH THE FIRST ONE. It made the fetch incremental, and its safety
      # rested on a coincidence: GitHub evicts an Actions cache after about seven days
      # unused, so under a monthly schedule it was always cold and every run rebuilt the
      # year from ENTSO-E. That was a free self-repair nobody designed. Four runs a month
      # would have kept it warm and silently ended the repair.
      #
      # WHY IT CAME BACK. On 18 August ENTSO-E returned 504 for the German generation pull.
      # With nothing stored there was nothing to fall back on, a chart lost a series, the
      # build aborted, and the pipeline published nothing for eight days.
      #
      # WHY IT IS NO LONGER AN ACTIONS CACHE, and this is the correction. That same seven-day
      # eviction makes the store EMPTY EXACTLY WHEN A SCHEDULED RUN NEEDS IT, because the
      # runs are eight days apart. It is not a near miss and it is not theoretical: the
      # 2 September run logged "no stored data for PT 2026 — FULL fetch" for every ENTSO-E
      # market. The last good run had been 26 Aug 11:03, seven days and one hour earlier,
      # and GitHub had queued the 07:23 cron until 12:09. So the safety net's availability
      # depended on the runner queue, and on the day it mattered it lost by an hour.
      #
      # A RELEASE ASSET INSTEAD. Release assets do not expire, do not enter git history (so
      # the repository does not grow: --clobber replaces), cost nothing on a public repo,
      # and need no account, secret or service beyond the GITHUB_TOKEN this job already
      # holds. That last point is the one that matters for handover: nothing here can lapse
      # while nobody is looking, which is the same argument that put the failure alert in a
      # GitHub issue rather than an email.
      #
      # The self-repair is untouched, and it lives in fetch.py rather than here:
      #   * every run re-fetches, so a series that fetches SUCCESSFULLY overwrites the store;
      #   * only a series whose fetch FAILED may lean on the stored copy;
      #   * and only while that copy is inside FALLBACK_DAYS. Past that the run fails rather
      #     than publishing old numbers as current.
      - name: Restore the fallback store for ${{ matrix.country }}
        run: |
          mkdir -p data/raw _store
          # Never fatal. No store yet, a deleted release, a network blip: all of them mean
          # "fetch the whole year", which is exactly what fetch.py does when it finds
          # nothing to merge into. A cold start must not be an outage.
          # EVERY FAILURE HERE MEANS "FETCH THE WHOLE YEAR", never "stop". No store yet, a
          # deleted release, a network blip, a truncated asset: fetch.py already widens a
          # window to the full year when it finds nothing to merge into, so a cold start is a
          # slower run and not an outage. The `tar` is inside the guard for the same reason —
          # the default shell is `bash -e`, so a corrupt asset would otherwise kill the job.
          if gh release download "$STORE_TAG" --pattern "raw-${{ matrix.country }}.tar.gz" \
               --dir _store --clobber 2>/dev/null \
             && tar -xzf "_store/raw-${{ matrix.country }}.tar.gz" -C data/raw 2>/dev/null; then
            echo "restored $(ls data/raw | wc -l) stored file(s) for ${{ matrix.country }}"
          else
            rm -rf data/raw/* 2>/dev/null || true   # a half-extracted store is worse than none
            echo "no usable stored copy for ${{ matrix.country }} — this run fetches the full year"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_TAG: raw-store
      - name: Fetch ${{ matrix.country }} (current year, plus the prior year at rollover)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        working-directory: _tools
        run: |
          YEAR=$(python -c "from datetime import date; print(date.today().year)")
          # Which fetcher does this market use? config.NON_ENTSOE is derived from the
          # country table, so a market added there routes itself without editing this.
          NON_ENTSOE=$(python -c "
          import config as c
          print(1 if '${{ matrix.country }}' in c.NON_ENTSOE else 0)")
          if [ "$NON_ENTSOE" = "1" ]; then
            echo "${{ matrix.country }} is not an ENTSO-E source — using fetch_uk.py"
            # SAME TRAILING WINDOW AS THE ENTSO-E MARKETS (2026-08-26). This called
            # `--force` over TWO whole years on every run, which was the longest fetch in
            # the stage once the other five dropped to between three and nine minutes.
            # fetch_uk widens back to a full year, per series, when nothing is stored.
            if ! python fetch_uk.py --years $((YEAR-1)),$YEAR --since-days 45
            then
              echo "the trailing window came back short — falling back to a FULL fetch"
              python fetch_uk.py --years $((YEAR-1)),$YEAR --force
            fi
            # Cross-border flows still come from ENTSO-E (the counterparty TSO publishes
            # each border), and fetch_uk handles that itself.
            exit 0
          fi
          # The frozen history normally ends at YEAR-1. In January it still ends at
          # YEAR-2, so the just-completed year has to be fetched too or it is lost
          # entirely (it is in neither the history nor the current-year pull).
          NEED_PRIOR=$(python -c "
          import build_hourly as b, config as c
          end = b.frozen_history_end()
          print(1 if end is not None and end < c.CURRENT_YEAR - 1 else 0)")
          if [ "$NEED_PRIOR" = "1" ]; then
            PRIOR=$((YEAR-1))
            echo "rollover detected — fetching ${{ matrix.country }} $PRIOR as well"
            python fetch.py --country ${{ matrix.country }} --years $PRIOR --force
            python fetch.py --country ${{ matrix.country }} --years $PRIOR
          fi
          # EVERY RUN RE-PULLS THE WHOLE YEAR (Fred's call, 2026-08-03). There is one
          # fetch mode and no conditional, which is the point: this pipeline has to stay
          # comprehensible to someone who did not build it and is reading it a year from
          # now, and a run that behaves differently depending on the date is exactly the
          # kind of thing that surprises them.
          #
          # It also means every run is maximally self-correcting. --force re-pulls from
          # ENTSO-E rather than trusting anything stored, so a raw file that has gone bad
          # is replaced within 8 days rather than surviving indefinitely. The old
          # incremental path used a 30-day trailing window, which caught ENTSO-E's
          # revisions to published data but could only ever rewrite the last 30 days.
          #
          # The second pass is not redundant: measured 2026-07-31, a single pass leaves
          # occasional hours empty where ENTSO-E returned a 503, and the second fills
          # them. After two passes there were ZERO gaps across 2024, 2025 and 2026.
          #
          # `full_refetch` is now a no-op — kept only so the Run workflow button keeps
          # the same shape for anyone who has been told to tick it.
          if [ "${{ inputs.repair || 'false' }}" = "true" ]; then
            # REPAIR RUN: re-fetch only what the last run could not get, and nothing else.
            # Two minutes instead of thirty, because everything that worked is already in
            # the fallback store. The series list comes from the gaps record that run wrote.
            # From the COMMITTED health record, not this run's workspace: a repair gets a
            # fresh checkout, so the only thing it can read is what the failing run pushed.
            ONLY=$(python - <<'PY'
          import json, os
          p = os.path.join("..", "published", "charts", "health.json")
          try:
              print(",".join(json.load(open(p)).get("series") or []))
          except Exception:
              print("")
          PY
          )
            if [ -z "$ONLY" ]; then
              echo "repair requested but no gaps record names a series — nothing to repair"
              exit 0
            fi
            echo "REPAIR of ${{ matrix.country }} $YEAR: $ONLY"
            python fetch.py --country ${{ matrix.country }} --years $YEAR --only "$ONLY"
            exit $?
          fi
          # A TRAILING WINDOW NORMALLY, THE WHOLE YEAR ONLY WHEN THAT FAILS
          # (Fred, 2026-08-26: "trailing window, periodic full only in case of error").
          #
          # Measured that morning: German January re-fetched came back IDENTICAL to what
          # was stored, 0 differing cells of 50,524 for generation and 0 of 2,972 for
          # price. Re-pulling January in August buys nothing, and this workflow was doing
          # it eight times a month for six markets. Restatement happens in recent weeks,
          # which is exactly what the window covers.
          #
          # The 2026-08-03 decision that replaced a 30-day window with a whole-year pull
          # is not simply being reversed. Its objection was real: a window "could only
          # ever rewrite the last 30 days", so a file that went bad in March stayed bad.
          # That is answered by the fallback below plus the gaps record, which names the
          # failed series so the repair run can re-fetch it in full. (That record raised
          # NameError on every partial fetch until 2026-08-26, so this design depends on a
          # mechanism that had never once run.)
          #
          # A cold cache needs no special case: fetch.py widens a window back to the full
          # year, per series, when there is nothing stored to merge into.
          echo "TRAILING-WINDOW fetch of ${{ matrix.country }} $YEAR (last 45 days)"
          if ! python fetch.py --country ${{ matrix.country }} --years $YEAR --since-days 45
          then
            echo "the trailing window came back short — falling back to a FULL year fetch"
            # THE FIRST PASS MUST NOT GATE THE SECOND. Since 2026-08-23 fetch.py exits
            # non-zero when a required series comes back with nothing usable, and under
            # `set -e` that would kill the step before the second pass ran — losing the
            # very retry that exists to fill a transient 503. So the first pass is
            # advisory and the second is the gate.
            python fetch.py --country ${{ matrix.country }} --years $YEAR --force || \
              echo "first pass had gaps; the second pass is the one that decides"
            python fetch.py --country ${{ matrix.country }} --years $YEAR   # fills 503 gaps
          fi
      # SAVE THE STORE, and do it even when the fetch FAILED. The Actions cache this
      # replaced skipped its post step on a failed job, so a run where four series came
      # back and one did not stored nothing at all, and the four good ones were re-fetched
      # from scratch next time. `always()` keeps whatever did work, which is the entire
      # point of a fallback store.
      #
      # Never fatal either. A failed upload must not turn a good run red: the store is a
      # convenience for the NEXT run, and the worst case without it is a full-year fetch.
      - name: Save the fallback store for ${{ matrix.country }}
        if: always()
        # NON-FATAL, AND IT HAS TO BE SAID IN YAML RATHER THAN IN A COMMENT. The default
        # shell here is `bash -e`, so the unguarded `tar` below would fail the step and take
        # the whole fetch job with it — turning a run that fetched perfectly well red because
        # a convenience for the NEXT run did not work. That is the exact opposite of what a
        # fallback store is for, and the `|| echo` on the upload alone did not cover it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_TAG: raw-store
        run: |
          if [ -z "$(ls -A data/raw 2>/dev/null)" ]; then
            echo "nothing fetched or restored — leaving the stored copy alone"
            exit 0
          fi
          # Six country jobs run in parallel and all six may find the tag missing on the
          # very first run. Losing that race is fine: --clobber below writes the asset
          # either way, and the assets are named per country so they never collide.
          gh release view "$STORE_TAG" >/dev/null 2>&1 || \
            gh release create "$STORE_TAG" --prerelease \
              --title "Raw fetch fallback store (machine-managed)" \
              --notes "Working files for .github/workflows/refresh.yml. Each asset is the raw ENTSO-E or Elexon parquet for one market, replaced on every run. Not a release of anything: it exists because an Actions cache expires after 7 days and the schedule runs every 8, so the fallback store was empty exactly when a failing run needed it. Public ENTSO-E and Elexon data, nothing derived." \
              2>/dev/null || true
          tar -czf "raw-${{ matrix.country }}.tar.gz" -C data/raw .
          ls -lh "raw-${{ matrix.country }}.tar.gz"
          gh release upload "$STORE_TAG" "raw-${{ matrix.country }}.tar.gz" --clobber \
            || echo "store upload failed; the next run just fetches the full year"
          rm -f "raw-${{ matrix.country }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.country }}
          path: data/raw/
          retention-days: 1
      # `always()`, because the interesting case is the one where the step above FAILED.
      # This record is the only structured account of what did not come back, and both the
      # repair run and the public status page read it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaps-${{ matrix.country }}
          path: _meta/fetch-gaps.json
          if-no-files-found: ignore
          retention-days: 7

  # ---- 2) assemble, summarise, publish --------------------------------------
  build:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Download all raw data
        uses: actions/download-artifact@v4
        with:
          path: _dl
      - name: Merge raw artifacts into data/raw
        run: |
          mkdir -p data/raw
          find _dl -name '*.parquet' -exec cp {} data/raw/ \;
          echo "raw files: $(ls data/raw | wc -l)"
          # The gap records travel with the raw data, one per country, so build_status.py
          # can put "one series came from stored data" into status.csv and the workbook can
          # say it. Named per country: they all arrive as fetch-gaps.json in their own
          # artifact folder and would otherwise overwrite each other.
          mkdir -p _meta
          for f in $(find _dl -name 'fetch-gaps.json'); do
            c=$(basename "$(dirname "$f")")          # gaps-DE -> gaps-DE
            cp "$f" "_meta/fetch-${c}.json"
          done
          echo "gap records: $(ls _meta/fetch-gaps*.json 2>/dev/null | wc -l)"
      # WITHOUT THIS CACHE THE SKIP CANNOT WORK (added 2026-08-26). fetch_hydro re-fetches
      # a year only when it is not already stored, but the build job starts from a clean
      # checkout, so nothing was ever stored and all 108 zone-years were pulled on every
      # run. Measured on run 32959091445: 21 minutes of the build job's 22, against 28
      # seconds to assemble the workbook itself.
      #
      # Safe to cache because a COMPLETED year never changes: a reservoir level for a week
      # in 2015 is a settled historical fact. fetch_hydro forces the CURRENT year on every
      # run regardless of what is cached, so the open year can never go stale here.
      #
      # AND IT DID NOT WORK (found 2026-09-06). Same seven-day eviction against an eight-day
      # cadence as the raw store, so a scheduled run found it cold and paid the 21 minutes
      # anyway; and both surviving hydro entries in the cache list measured 0 MB, so the
      # glob path was storing nothing even when it did hit. Moved to the same release asset
      # the raw store now uses, which neither expires nor depends on a glob.
      - name: Restore the settled hydro years
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_TAG: raw-store
        run: |
          mkdir -p data/raw _store
          # Guarded the same way as the per-country restore: a corrupt asset costs 21 minutes
          # of refetching, never a failed build.
          if gh release download "$STORE_TAG" --pattern "hydro.tar.gz" --dir _store --clobber 2>/dev/null \
             && tar -xzf _store/hydro.tar.gz -C data/raw 2>/dev/null; then
            echo "restored $(ls data/raw/hydro_*.parquet 2>/dev/null | wc -l) settled hydro year(s)"
          else
            rm -f data/raw/hydro_*.parquet 2>/dev/null || true
            echo "no usable stored hydro years — this run fetches all of them"
          fi
      - name: Fetch the weekly hydro reservoir series
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        working-directory: _tools
        run: |
          # A72 water reservoirs: weekly, a STOCK not a flow, so it sits outside the
          # per-country matrix above and never joins the hourly master. Fetched
          # concurrently, and a settled year that is already stored is skipped.
          python fetch_hydro.py
      - name: Save the settled hydro years
        if: always()
        # Same reasoning as the per-country save above: a storage step must never be able to
        # fail a build that succeeded.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_TAG: raw-store
        run: |
          if ! ls data/raw/hydro_*.parquet >/dev/null 2>&1; then
            echo "no hydro files to store"; exit 0
          fi
          gh release view "$STORE_TAG" >/dev/null 2>&1 || \
            gh release create "$STORE_TAG" --prerelease \
              --title "Raw fetch fallback store (machine-managed)" \
              --notes "Working files for .github/workflows/refresh.yml." 2>/dev/null || true
          tar -czf hydro.tar.gz -C data/raw $(cd data/raw && ls hydro_*.parquet)
          ls -lh hydro.tar.gz
          gh release upload "$STORE_TAG" hydro.tar.gz --clobber \
            || echo "hydro store upload failed; the next run refetches the settled years"
          rm -f hydro.tar.gz

      - name: Build + summarise + export
        working-directory: _tools
        run: |
          # At the January rollover, fold the completed year into the frozen history
          # first — otherwise the incremental build below silently loses that year.
          # No-op in every other month.
          python build_hourly.py --absorb-prior-year
          python build_hourly.py
          python summaries.py
          # THE ONLY CHECK IN THIS PIPELINE THAT ASKS WHETHER A NUMBER IS RIGHT (wired in
          # 2026-09-06). Everything else here is structural: the Open XML validator asks
          # whether Excel will open the file, check_reference_stability whether a column
          # moved, check_coverage whether anything got shorter, check_consistency whether
          # the two decks agree. All of them pass on data that is the right shape and the
          # wrong numbers, which is how a 31-day "year" published twice on 2026-07-31 and
          # how run-of-river silently left every market on 2026-09-05.
          #
          # validate.py compares the built data against figures published in the Redburn
          # appendix (Germany 2024 near-negative hours, average daily spread, solar and gas
          # capture) plus two internal invariants. It existed from the start, INDEX.md
          # listed it as part of the system, and NOTHING INVOKED IT. It also exited 0 on a
          # FAIL until today, so wiring it in before that would have bought nothing.
          #
          # It gates, and gating is safe: every assertion is over settled years that come
          # off the frozen history and are identical on every run, so a FAIL means a build
          # changed a number that cannot legitimately change. It runs here rather than after
          # the publish because the point is to stop the publish.
          python validate.py
          python export_csv.py          # tidy/long CSVs
          python chart_csv.py           # chart-ready wide CSVs (what Excel loads)
          # extra_summaries AFTER chart_csv: its line_windows step READS the fig2/fig3/
          # fig4 CSVs that chart_csv writes. Reversed, it builds that table from the
          # previous run's files, which is invisible until a column set changes.
          python extra_summaries.py     # G1/G2/G3 hourly-granularity tables
          python summarise_hydro.py     # weekly reservoir bands -> hydro_window.csv
          python build_status.py        # status.csv -> the staleness banner in Excel

      # BEFORE publishing, while published/ is still the baseline the live workbooks in
      # the wild are pointed at. A column that moved sideways does not shorten anything
      # and does not break the package, so neither check_coverage nor check_consistency
      # can see it — but every chart to its right silently plots a different series.
      - name: Refuse a layout that moved existing columns or rows
        working-directory: _tools
        run: |
          python check_reference_stability_fixtures.py
          python check_reference_stability.py
          # The two halves of every split table must reach the same period: they come
          # from different sources, so one can stall while the other keeps publishing.
          python check_split_parity.py

      - name: Publish CSVs to /published
        run: |
          mkdir -p published/charts
          cp outputs/csv/*.csv outputs/csv/manifest.json published/
          cp outputs/csv/charts/*.csv published/charts/
          echo "Last refreshed: $(date -u +'%Y-%m-%d %H:%M UTC')" > published/LAST_REFRESH.txt

      # THE LAST MILE (2026-09-06). Everything above this line stops at the git commit.
      # The workbook on the share drive fetches 24 specific CSVs from
      # raw.githubusercontent.com every time somebody opens it, and until today nothing
      # in this pipeline knew those 24 files existed. Rename or drop one and every guard
      # here stays green while the reader gets a Power Query error, or keeps the values
      # Excel last saved with nothing saying they are stale.
      #
      # Runs HERE, against published/charts, because that directory is the exact surface
      # those URLs serve (status.csv is written straight into it by build_status.py), and
      # because failing before the 6-minute deck rebuild beats failing after it.
      #
      # The list is EXTRACTED from the workbook, never typed: EXCEL_SETUP.md described 18
      # files where the workbook queries 24, so a hand-transcribed list would have shipped
      # a 25% blind spot in the one check whose whole job is to notice.
      - name: Refuse a publish that would break the live workbook
        working-directory: _tools
        run: |
          python check_workbook_queries_fixtures.py
          python check_workbook_queries.py

      - name: Install Arial-compatible fonts for the chart render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          fc-list | grep -ci "liberation sans" || (echo "font missing" && exit 1)

      - name: Rebuild the deliverables (workbook + decks)
        working-directory: _tools
        run: |
          # This is what removes the last manual step. Charts carry one series per
          # year, so a newly completed year only appears via a rebuild — running
          # generate.py here means that happens by itself, on any machine, forever.
          python generate.py
          python check_consistency.py

      - name: Stage the rebuilt deliverables
        run: |
          mkdir -p deliverables
          cp outputs/HourlyPowerData.xlsx outputs/HourlyPowerData.pptx \
             outputs/HourlyPowerData_frozen.xlsx outputs/HourlyPowerData_snapshot.pptx \
             deliverables/
          ls -la deliverables/

      # NOTHING is committed by this job. Everything it produced is handed on as an
      # artifact and committed by `publish` below, only once the Windows validator and
      # the coverage guard have both passed. Until 2026-07-31 this job committed first
      # and validated afterwards, so an invalid package landed in the repo and only
      # THEN turned the run red — which is exactly how a workbook that made Excel offer
      # to Recover reached deliverables/.
      - name: Stage the data to publish
        run: |
          mkdir -p payload/data/processed
          cp -r published payload/published
          cp -r deliverables payload/deliverables
          cp data/processed/master_fixed.parquet data/processed/capacity_fixed.parquet \
             payload/data/processed/
          du -sh payload
      - uses: actions/upload-artifact@v4
        with:
          name: publish-payload
          path: payload/
          retention-days: 1

  # ---- 3) validate the built files with Microsoft's OWN schema validator -------
  # windows-latest is free and unlimited on a public repo and ships .NET, so this costs
  # nothing. It matters because our own checks are hand-written: they encode the faults
  # we have already hit and nothing else. Twice on 2026-07-31 a workbook passed every
  # check we had and still made Excel offer to Recover (a missing [Content_Types]
  # override; a strCache declaring points it did not hold). Both are schema violations,
  # and this is the same definition Excel uses to decide.
  #
  # It CANNOT render anything — Microsoft does not licence Excel on hosted runners — so
  # this answers "is the package valid", never "does the chart look right".
  #
  # This job now GATES the publish rather than trailing it, so a package it rejects
  # never reaches the repository at all.
  validate:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30        # dotnet-script install plus four OOXML validations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: publish-payload
          path: payload
      - name: Install dotnet-script
        run: dotnet tool install -g dotnet-script
      - name: Validate every deliverable against the Open XML schema
        shell: pwsh
        run: |
          $files = Get-ChildItem payload/deliverables -Include *.xlsx,*.pptx -Recurse |
                   ForEach-Object { $_.FullName }
          Write-Host "validating $($files.Count) file(s)"
          if ($files.Count -lt 4) { throw "expected 4 deliverables, found $($files.Count)" }
          dotnet script _tools/validate_ooxml.csx -- @files

  # ---- 4) guard the data, then commit ----------------------------------------
  # The LAST job, and the only one that writes to the repository. It runs after every
  # check has passed, which is the whole point: nothing reaches main that the Open XML
  # validator or the coverage guard rejected.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20        # a checkout, a copy and a push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          name: publish-payload
          path: payload
      - name: Lay the built files over the checked-out repo
        run: |
          test -d payload/published && test -d payload/deliverables || {
            echo "publish-payload is not shaped as expected:"; find payload -maxdepth 2; exit 1; }
          mkdir -p published deliverables data/processed
          cp -r payload/published/. published/
          cp -r payload/deliverables/. deliverables/
          cp payload/data/processed/*.parquet data/processed/
          git status --short | head -40

      # THE COVERAGE GUARD. Everything else asks "is this data valid?"; this asks "is it
      # the data we already had, plus more?" On 2026-07-31 the answer was no and nothing
      # noticed: a cold cache made the incremental fetch publish a 31-day "year" in place
      # of 212 days, twice (commits d4bdc58 and 8db1093). The run was fast and green and
      # every validator passed — correctly, because a 31-day series is perfectly VALID
      # data. It is just the wrong data.
      #
      # Replayed over the repo's whole published history: silent on every ordinary
      # refresh, and it fires on exactly the commits that shipped or restored bad data.
      #
      # The baseline is origin/main rather than the checkout, because that is the state
      # this run is about to commit on top of — the same ref the reset below moves to.
      # A GREEN RUN CLEARS IT, and says so if it published on stored data. Without this the
      # page would keep showing August's 504 forever. `stale` is the honest half: a run can
      # succeed having leaned on the fallback store for one series, and that is not the same
      # as everything being fresh.
      - name: Download the gaps records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gaps-*
          path: _gaps
      - name: Refresh the health record
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, datetime
          stale = []
          for p in glob.glob("_gaps/**/fetch-gaps.json", recursive=True):
              try:
                  stale += json.load(open(p)).get("stale") or []
              except Exception:
                  pass
          out = {"state": "ok" if not stale else "ok-on-stored-data",
                 "at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                 "reason": "" if not stale else
                           "; ".join(f"{g['series']}: fetch failed, published from stored data "
                                     f"to {g['covers_to']} ({g['days_old']}d old)" for g in stale),
                 "series": sorted({g["series"] for g in stale}),
                 "fatal": [], "stale": stale}
          os.makedirs("published/charts", exist_ok=True)
          json.dump(out, open("published/charts/health.json", "w"), indent=1)
          print(json.dumps(out, indent=1))
          PY
      - name: Assert published coverage has not shrunk
        run: |
          git fetch origin main
          python _tools/check_coverage.py --baseline origin/main

      # AND THAT NO SETTLED NUMBER MOVED (2026-09-06). check_coverage above asks whether the
      # data got shorter or blanker. Nothing asked whether it got DIFFERENT. Every guard in
      # this pipeline passes on a file that is the right shape and holds the wrong numbers,
      # which is how a 31-day "year" published twice on 2026-07-31 and how run-of-river left
      # every market on 2026-09-05 with every job reporting success.
      #
      # A month or year that has closed should not move. Tolerances are measured, not chosen:
      # a cleared price does not get revised, generation is restated for weeks afterwards, so
      # price feeds are held to 0.5% and generation-derived ones to 8%. Replayed over all 50
      # published transitions in this repository's history: silent on 46, and it speaks on
      # d4bdc58, one of the two commits documented as having shipped bad data.
      #
      # Runs AFTER the coverage guard because that one is cheaper and its message is simpler,
      # so where both would fire the reader gets the plainer of the two first.
      - name: Assert no settled value has changed
        run: python _tools/check_value_stability.py --baseline origin/main

      - name: Commit published data
        run: |
          git config user.name  "power-price-bot"
          git config user.email "actions@github.com"
          # master_fixed/capacity_fixed change only at the rollover, but they MUST be
          # committed when they do — they are the history every later run builds on.
          #
          # `git pull --rebase` was wrong here and failed for real on 2026-07-31: every
          # file this job commits is REGENERATED from scratch, so if another run pushed
          # in the meantime, rebasing replays our commit onto theirs and every single
          # CSV conflicts (different timestamps, same lines). `|| true` then swallowed
          # the error, leaving a detached HEAD, and the push died with exit 128 — so a
          # 25-minute build produced nothing and the fix it carried never shipped.
          #
          # There is nothing to merge: this run's output IS the newest complete state.
          # So move the branch pointer to origin and commit once on top of it. No
          # replay, so no conflict is possible.
          #
          # The reset is MIXED, not --soft, and that distinction is load-bearing. A soft
          # reset moves HEAD but leaves the INDEX holding the checkout, so `git commit`
          # writes back every file that changed on main during the run — reverting it
          # silently. That is not hypothetical: on 2026-07-31 commit 8db1093 deleted a
          # pending-updates.md row a human had added 30 minutes earlier, and the run went
          # green. A mixed reset rebuilds the index from origin, so `git add` below
          # stages OUR paths and nothing else can ride along.
          git fetch origin main
          git reset --mixed origin/main
          git add published deliverables data/processed/master_fixed.parquet data/processed/capacity_fixed.parquet
          # Anything staged that we did not name is a file this job must not touch.
          UNEXPECTED=$(git diff --staged --name-only |
                       grep -Ev '^(published/|deliverables/|data/processed/(master|capacity)_fixed\.parquet$)' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "refusing to commit files outside the publish set:"; echo "$UNEXPECTED"; exit 1
          fi
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data refresh $(date -u +'%Y-%m-%d')"
            git push origin HEAD:main
          fi

  # ---- 5) tell a human when any of the above failed ---------------------------
  # Until 2026-08-03 nothing announced a failure. GitHub emails the repository owner,
  # but that is a setting nobody can verify from outside the account, it goes to one
  # address, and it is easy to filter into nothing. The 45-day staleness banner in the
  # workbook was the real backstop, so a failed run could go unnoticed for six weeks.
  #
  # This job opens a GitHub ISSUE instead, which is deliberately not an email:
  #   * it is durable and public — it sits in the Issues tab until someone closes it,
  #     so it cannot be missed by being read and forgotten;
  #   * it @-mentions the owner, which notifies regardless of the repo's watch setting;
  #   * it carries a direct link to the failed run's log, which is the first thing
  #     anyone diagnosing this needs;
  #   * it needs no secret, no mail service and no external account, so there is nothing
  #     here that can expire while nobody is looking. That last point is the whole
  #     argument: a notification channel that quietly stops working is worse than none,
  #     because it converts silence from "unknown" into "fine".
  #
  # It reuses one open issue rather than filing a new one per failure, so a repeatedly
  # failing schedule leaves a single thread with a comment per run, not forty issues.
  notify:
    needs: [fetch, build, validate, publish]
    # cancelled() as well as failure(): GitHub's failure() is FALSE for a
    # cancelled run, so a cancellation opened no issue and wrote no health
    # record, and the status page went stale on age alone — the exact
    # blindness the health record exists to remove.
    #
    # BUT A CANCELLATION IS NOT A FAILURE, and until 2026-08-26 this job called it one.
    # Cancelling run 32959091445 by hand wrote state "failed" with the reason "the run
    # failed after the fetch step", and the public page told every reader the refresh had
    # failed when nothing had. A queued run superseded by a newer one is cancelled the same
    # way, so this was reachable without anyone pressing anything. The job still runs on
    # both, because silence is what the paragraph above rules out; what changes is that it
    # now says WHICH of the two happened, and only a real failure opens an issue.
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10        # a JSON write and one gh call
    permissions:
      issues: write
      contents: write          # for the health record below
    steps:
      - uses: actions/checkout@v4
      # THE HEALTH RECORD (2026-08-23). The public status page went stale on AGE alone, so
      # after the August outage it correctly said the data was old and could not say which
      # series was missing or why — the reason sat in a run log nobody opens. This publishes
      # that reason, and it is the same file the repair run reads to know what to re-fetch.
      # Written here rather than in `publish`, because on a failure `publish` never runs.
      - name: Download the gaps records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gaps-*
          path: _gaps
      - name: Publish why the run failed
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_STATE: ${{ contains(needs.*.result, 'failure') && 'failed' || 'cancelled' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, datetime
          recs = []
          for p in glob.glob("_gaps/**/fetch-gaps.json", recursive=True):
              try:
                  recs.append(json.load(open(p)))
              except Exception:
                  pass
          fatal, stale, series = [], [], set()
          for r in recs:
              fatal += r.get("fatal") or []
              stale += r.get("stale") or []
              series |= set(r.get("series") or [])
          state = os.environ.get("RUN_STATE") or "failed"
          # CAN ANOTHER RUN FIX THIS? (2026-09-06). fetch.py already knew — `_transient`
          # decides whether to retry — and threw the answer away, so a malformed request and
          # a gateway timeout reached this file looking identical. On 2026-09-02 that cost two
          # repair runs and three days: ENTSO-E started refusing windows over a month, the
          # pinned entsoe-py kept sending them, and every re-run met the same 400.
          #
          # Retryable only if EVERY fatal gap is. A repair that re-fetches four transient
          # series still publishes nothing while the fifth is malformed.
          #
          # DEFAULT TRUE, on both sides: a gap record without the field (one written before
          # today, or a failure that never reached fetch.py) behaves exactly as it used to.
          stuck = [g for g in fatal if g.get("retryable") is False]
          retryable = not stuck
          stuck_why = ("; ".join(f"{g['series']}: {g.get('cause','?')}" for g in stuck)
                       if stuck else "")
          out = {
              "state": state,
              "at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "run": os.environ.get("RUN_URL", ""),
              # A run can fail for reasons that never reach fetch.py at all (a pinned wheel
              # disappearing, the schema validator refusing a deliverable). Saying so beats
              # an empty list, which would read as "nothing was wrong".
              "reason": ("; ".join(f"{g['series']}: {g['why']}" for g in fatal) if fatal
                         else "the run was stopped before it finished" if state == "cancelled"
                         else "the run failed after the fetch step — see the run log"),
              "series": sorted(series),
              "retryable": retryable,
              "stuck": stuck_why,
              "fatal": fatal,
              "stale": stale,
          }
          os.makedirs("published/charts", exist_ok=True)
          json.dump(out, open("published/charts/health.json", "w"), indent=1)
          print(json.dumps(out, indent=1))
          PY
          git config user.name  "power-price-bot"
          git config user.email "power-price-bot@users.noreply.github.com"
          git add published/charts/health.json
          git diff --cached --quiet && { echo "health record unchanged"; exit 0; }
          git commit -m "health: record why the refresh did not publish"
          # The publish job may have pushed between our checkout and now; rebase rather
          # than force, because this file is never the thing worth winning a race over.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Open or update the failure issue
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # WHICH KIND OF FAILURE, read straight off the health record this job just wrote.
          # Until 2026-09-06 the body always said "retry the workflow, it is usually nothing
          # else", which on 2026-09-02 was advice that could not work and was followed twice
          # by the repair job before a person read the log three days later.
          VERDICT="Probably transient. The repair run later today retries automatically."
          if [ -f published/charts/health.json ]; then
            V=$(python - <<'PY'
          import json
          try:
              h = json.load(open("published/charts/health.json"))
          except Exception:
              h = {}
          if h.get("retryable") is False:
              print("**RETRYING WILL NOT FIX THIS.** " + (h.get("stuck") or "")
                    + ". A 4xx, a schema change or a renamed upstream label needs a code "
                      "change. The repair run is deliberately not firing.")
          else:
              print("Probably transient. The repair run later today retries automatically.")
          PY
          ) || V=""
            [ -n "$V" ] && VERDICT="$V"
          fi
          TITLE="Data refresh is failing"
          BODY=$(cat <<EOF
          @${{ github.repository_owner }} — the ENTSO-E refresh failed.

          * **Run:** $RUN_URL
          * **Triggered by:** \`$EVENT\`
          * **When:** $(date -u +'%Y-%m-%d %H:%M UTC')
          * **Can a re-run fix it?** $VERDICT

          **What this means.** No new data was published. The workbook keeps showing the
          last good figures, so nothing is wrong with what people are already looking at —
          it is just not moving. Nothing was corrupted: the publish job is the only writer
          to the repository and it only runs once every check has passed.

          **What to do.** Open the run log above and read the first red step. The usual
          causes, in the order they actually occur:

          1. ENTSO-E was down or rate-limiting (a 5xx, a timeout). Retry the workflow; the
             repair run is already doing that for you within hours.
          2. ENTSO-E answered a 4xx, or renamed something. **A retry cannot fix this** and the
             line above will say so. It means the request itself is now wrong: a query window
             the platform no longer accepts, a renamed production-type label, a changed schema.
             The fix is a code change, usually a dependency bump. This is what happened on
             2 September 2026.
          3. The coverage guard refused to publish because a feed lost data. That is the guard
             doing its job; the log names the file and the columns.
          4. A pinned dependency has no wheel any more — the failure is at \`pip install\`.

          **If nobody is available to look at this,** it depends on which of the two it is, and
          the line at the top says which. A transient failure heals itself: the repair run
          retries the same day and the next scheduled run is at most 8 days away. A failure
          marked not retryable will NOT heal, and every run until someone changes something will
          fail in exactly the same place.

          This issue is reused for every failure — check the comments for how long it has been
          going. Close it once a run goes green.
          EOF
          )
          # Create the label BEFORE filtering on it. `gh issue list --label` errors on a
          # label that does not exist, and under `set -e` that would kill the very job
          # whose only purpose is to raise the alarm — a notifier that fails silently is
          # the worst possible outcome here.
          gh label create refresh-failure --color B60205 \
             --description "The scheduled data refresh failed" 2>/dev/null || true
          # Never let the lookup itself be fatal either: if it fails for any reason we
          # would rather file a duplicate issue than none at all.
          EXISTING=$(gh issue list --state open --label refresh-failure \
                       --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "opening a new issue"
            gh issue create --title "$TITLE" --label refresh-failure --body "$BODY"
          fi
