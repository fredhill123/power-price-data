name: Repair a partial ENTSO-E refresh

# WHY THIS EXISTS. On 18 August 2026 ENTSO-E returned HTTP 504 for the German generation
# pull, twice, roughly 23 minutes apart. Nothing published for the next eight days, because
# the next scheduled slot was eight days away and it met the same wall. Retrying inside the
# run helps with an outage measured in seconds; this is the answer to one measured in hours.
#
# IT DOES NOT DUPLICATE THE PIPELINE. It reads the health record the failing run published,
# and if a required series is still missing it re-triggers `refresh.yml` with `repair=true`.
# That run re-fetches ONLY the named series — everything that already worked is in the
# fallback store — then builds and publishes through exactly the same jobs as any other run.
# Two minutes of fetching instead of thirty, and one definition of what "build" means.

on:
  schedule:
    # Two attempts on each refresh day, about four and eight hours after the 07:23 run.
    # Off the hour and off the half hour, like the main schedule: those minutes are when
    # every scheduler on the planet fires at once and GitHub's queue shows it.
    - cron: "7 11 2,10,18,26 * *"
    - cron: "7 15 2,10,18,26 * *"
    # TWO MORE, 2026-09-05 (Fred: "could we just have more reattempts than we
    # currently have?"). Four attempts spanning 16 hours instead of two spanning 8.
    # Deliberately NOT in-run retries: the fetch job already allows 100 minutes and DE
    # alone takes 60-65, so a longer in-run ladder converts a clean fast failure into a
    # timeout that truncates the health record this workflow reads. And deliberately
    # not daily: Fred declined that. Each attempt costs ~14s when nothing is missing.
    - cron: "7 19 2,10,18,26 * *"
    - cron: "7 23 2,10,18,26 * *"
  workflow_dispatch:

permissions:
  actions: write        # to dispatch refresh.yml
  contents: read

concurrency:
  group: repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Is anything actually missing?
        id: gate
        run: |
          set -euo pipefail
          F=published/charts/health.json
          if [ ! -f "$F" ]; then
            echo "no health record — nothing has reported a gap"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          h = json.load(open("published/charts/health.json"))
          # Only a FATAL gap earns a repair. "ok-on-stored-data" means the run published
          # from the fallback store, which is a note for the reader, not a job to redo:
          # the next scheduled full re-pull replaces it anyway.
          #
          # AND ONLY A RETRYABLE ONE (2026-09-06). On 2026-09-02 this gate said yes twice to
          # a failure no retry could clear: ENTSO-E had begun refusing query windows longer
          # than a month, the pinned entsoe-py kept sending them, and both dispatched repair
          # runs met the identical HTTP 400 on all five markets. Two runs, thirty-odd runner
          # minutes, and a status page that kept promising a repair was under way, for a
          # fault that needed a person.
          #
          # `retryable` is written by the failing run from fetch.py's own judgement, the same
          # one it uses to decide whether to retry in-process. MISSING MEANS TRUE, so a health
          # record written before today behaves exactly as it did.
          retryable = h.get("retryable", True) is not False
          go = h.get("state") == "failed" and bool(h.get("series")) and retryable
          print(f"go={'true' if go else 'false'}")
          print(f"why={h.get('reason','')[:200]}")
          print(f"stuck={h.get('stuck','')[:200]}")
          print(f"retryable={'true' if retryable else 'false'}")
          print(f"series={','.join(h.get('series') or [])}")
          PY
      - name: Re-fetch only the missing series, then publish as normal
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "repairing: ${{ steps.gate.outputs.series }}"
          echo "reason recorded by the failing run: ${{ steps.gate.outputs.why }}"
          gh workflow run refresh.yml --ref "${GITHUB_REF_NAME}" -f repair=true
      - name: Nothing to do
        if: steps.gate.outputs.go != 'true'
        run: |
          if [ "${{ steps.gate.outputs.retryable }}" = "false" ]; then
            echo "NOT REPAIRING, deliberately. The last run failed in a way no re-run can fix:"
            echo "  ${{ steps.gate.outputs.stuck }}"
            echo
            echo "A 4xx, a schema change or a renamed upstream label needs a code change. The"
            echo "failure issue says the same thing, and the status page says it to the public."
            echo "Re-dispatching here would burn a runner to reproduce the identical error, which"
            echo "is what happened twice on 2026-09-02."
          else
            echo "the last run did not report a missing series — no repair needed"
          fi
